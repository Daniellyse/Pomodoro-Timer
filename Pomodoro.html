<!DOCTYPE html>
<html>
    <body>
        <p id = "msg"></p>
        <p id = "timer"></p>
        <script>
            //Name: Distractions
            const _studyTime = 1; //total minutes in study timer
            let breakTime = 1;//total minutes in break timer (changes w/Cycle)
            //
            let minutes= 0;//for timer use
            let seconds = 0;
            //
            let timeState = 1; //controls switchStates
            let isBreakTime = false;//Determines if in Study or Break state
            //
            let cycle = 0; //after 4 cycles, 20-30 minute break
            const _addTime= 1; 

            
            //StudyTime(30m) & BreakTime (10m) 0/4 cycles [Set above]
            //Display StudyMsg && Setup Study mins [Done]
            //CountDownTimer && CountDownMsg [Done]
            //TimerEnd->Display Time's Up [Done]
            //Set Break timer -> Display BreakMSG [Done]
            //CountDownTimer && CountDownMsg [Done]
            //TimerEnd->Display Time's Up [Done]
            //increment cycle && Break Time++ when cycle >=4(cycle-Handling) [Done]
            //Display StudyMsg (loop)
            function displayTimer(){
                switch(timeState){
                    case 1: //studytime 
                        document.getElementById("msg").innerHTML = "It's Study Time!";
                        document.getElementById("timer").innerHTML = "";
                        minutes = _studyTime; 
                        isBreakTime=false;
                        timeState = 3; //start timer
                        break;
                        
                    case 2: //breaktime                        
                        document.getElementById("msg").innerHTML = "It's Break Time!";
                        document.getElementById("timer").innerHTML = "";
                        minutes = breakTime;
                        isBreakTime = true;
                        timeState = 3; //start timer
                        break;
                    case 3: //running timer
                        runningTime();
                        break;
                    case 4: //timer end & cycle handler
                        if(isBreakTime === true){
                            //Just finished breakTime
                            //we finished one cycle
                            cycle++;
                            timeState = 1; //Break's over! Time to study
                        }
                        if(isBreakTime===false){
                            //Just finished StudyTime
                            //Go take a break!
                            timeState = 2;
                        }
                        if(cycle===4){
                            cycle =0 //reset
                            breakTime +=_addTime;

                        }

                        break;
                }
            }
            function runningTime(){
                if (minutes ===0&&seconds <=0){
                    
                    document.getElementById("msg").innerHTML = "Time's Up!";
                    document.getElementById("timer").innerHTML = "0m0s";
                    timeState = 4;
                }
                else{
                    document.getElementById("timer").innerHTML = minutes +"m"+seconds+"s";
                    //After 0 comes 59;
                    if(minutes>=1&&seconds==0){
                        seconds = 59;
                        minutes--;
                    }
                    else{
                        seconds--;
                    }
                }
                
            }
        </script>
        <button onclick="setInterval(displayTimer,1000);">Start Timer</button>
        <p>To reset the timer, please refresh the page.</p>
        
    </body>
</html>
