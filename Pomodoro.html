<!DOCTYPE html>

<html>

    <body>

        <p id = "timer"></p>
        <script>
            //Name: Distractions
            const _studyTime = 30; //total minutes in study timer
            const _breakTime = 10;//total minutes in break timer
            const _addTime= 5;

            let minutes= 1;// 
            let seconds = 0;
            let timeState = 1;
            let isBreakTime = false;
            let cycle = 0; //after 4 cycles, 20-30 minute break

            
            //StudyTime(30m) & BreakTime (30m) 0/4 cycles
            //Display StudyMsg && Setup Study mins
            //CountDownTimer && CountDownMsg
            //TimerEnd->Display Time's Up
            //Set Break timer -> Display BreakMSG
            //CountDownTimer && CountDownMsg
            //TimerEnd->Display Time's Up
            //increment cycle && Break Time++ when cycle >=4
            //Display StudyMsg (loop)
            function displayTimer(){
                switch(timeState){
                    case 1: //studytime 
                        document.getElementById("timer").innerHTML = "It's Study Time!";
                        minutes = _studyTime;
                        isBreakTime=false;
                        timeState = 3;
                        break;
                        
                    case 2: //breaktime
                        
                        //display breaktime to HTML
                        //Start timer countdown for break time
                        
                        document.getElementById("timer").innerHTML = "It's Break Time!";
                        break;
                    case 3: //running timer
                        runningTime();
                        break;
                    case 4: //timer end & cycle handler
                        
                        document.getElementById("timer").innerHTML = "Time's Up!";

                        break;
                }
            }
            function runningTime(){
                if (minutes ===0&&seconds ===0){
                    timeState = 4;
                }
                else{
                    document.getElementById("timer").innerHTML = minutes +"m"+seconds+"s";
                    //After 0 comes 59;
                    if(minutes>=1&&seconds==0){
                        seconds = 59;
                        minutes--;
                    }
                    else{
                        seconds--;
                    }
                }
                
            }
            

                
        </script>
    
        <button onclick="setInterval(displayTimer,1000)">Start Timer</button>
        
    </body>
</html>
