<!DOCTYPE html>
<html>
    <body>
        <p id = "timer"></p>
        <script>
            const _studyTime = 30; //total minutes in study timer
            const _breakTime = 10;//total minutes in break timer

            let minutes= _studyTime;// 
            let seconds = 0;
            setInterval(displayTimer,1000);
            function displayTimer(){

                if (minutes ===0&&seconds ===0){
                    
                    document.getElementById("timer").innerHTML = "Times Up!";
                
                }
                else{

                    document.getElementById("timer").innerHTML = minutes +"m"+seconds+"s"
                    //After 0 comes 59;
                    if(minutes>=1&&seconds==-1){
                        seconds = 59;
                        minutes--;
                    }
                    else{
                        seconds--;
                    }
                }
                
            }
        </script>
    </body>
</html>
