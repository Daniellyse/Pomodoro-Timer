<!DOCTYPE html>
<html>
    <body>
        <p id = "timer"></p>
        <script>
            const _studyTime = 30; //total minutes in study timer
            const _breakTime = 10;//total minutes in break timer

            let minutes= 1;// 
            let seconds = 0;
            let isBreakTime = false;
            setInterval(displayTimer,1000);
            function displayTimer(){

                if (minutes ===0&&seconds ===0){
                    
                    document.getElementById("timer").innerHTML = "Time's Up!";
                    isBreakTime= true;
                
                }
                if(isBreakTime === true){
                    document.getElementById("timer").innerHTML = "Break Time!";
                    minutes = 2;
                    isBreakTime=false;
                }
                else{
                    
                    document.getElementById("timer").innerHTML = minutes +"m"+seconds+"s";
                    //After 0 comes 59;
                    if(minutes>=1&&seconds==0){
                        seconds = 59;
                        minutes--;
                    }
                    else{
                        seconds--;
                    }
                }
                
            }
        </script>
    </body>
</html>
